name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: make sync

      - name: Check architecture (import-linter)
        run: make lint

      - name: Run tests
        run: make test

      - name: Run integration tests (real Postgres + MinIO via testcontainers)
        run: make integration

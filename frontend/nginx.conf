server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDFs are uploaded through this proxy; don't cap the body at nginx's 1M default.
    client_max_body_size 50m;

    # SPA fallback: serve the app shell for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: preserve the /api prefix and forward to the api service
    # on the compose network, so the browser never makes a cross-origin call.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

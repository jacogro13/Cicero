# Alembic config for the dev CLI (ADR-024). The running app configures Alembic
# programmatically in adapters/persistence/migrations.py; env.py resolves the URL
# from this file's sqlalchemy.url or, when unset (the CLI case), $DATABASE_URL.
[alembic]
script_location = src/cicero/migrations
prepend_sys_path = src

[project]
name = "pagemaster"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx2>=2.4",
    "import-linter>=2.11",
    "testcontainers[postgres]>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repositories and the Unit of Work are async ports; `auto` lets async test
# functions run without a per-test marker.
asyncio_mode = "auto"

# Architecture fitness function for the hexagonal layering of ADR-001/004:
# outer layers may import inner ones, never the reverse. Layers are listed
# high-to-low; `adapters/` joins the chain when it is introduced in a later
# batch.
[tool.importlinter]
root_package = "pagemaster"

[[tool.importlinter.contracts]]
name = "Hexagonal layering: outer imports inner only"
type = "layers"
layers = [
    "pagemaster.entrypoints",
    "pagemaster.services",
    "pagemaster.domain",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
